[project]
name = "kartrix"
version = "0.1.0"
description = "Kartrix — an autonomous, security-first AI coding agent with RAG-powered codebase understanding, planning and verified task execution."
readme = "README.md"
authors = [
    {name = "Roshan Karthik", email = "roshankarrthik@gmail.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.2.2,<2.0.0",
    "openai>=2.43.0,<3.0.0",
    "rich>=15.0.0,<16.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "langchain>=1.3.11,<2.0.0",
    "langchain-openai>=1.3.3,<2.0.0",
    "langchain-anthropic>=1.4.7,<2.0.0",
    "langchain-huggingface>=1.2.2,<2.0.0",
    "tree-sitter==0.21.3",
    "tree-sitter-languages==1.10.2",
    "langchain-mcp-adapters>=0.3.0,<0.4.0",
    "watchdog>=6.0.0,<7.0.0",
    "redis>=7.4.1,<8.0.0",
    "redisvl>=0.23.0,<0.24.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "langchain-nvidia-ai-endpoints>=1.0,<2.0",
    "pathspec>=0.12,<1.0",
    "pgvector>=0.4,<1.0",
]

[project.scripts]
kartrix = "kartrix.main:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kartrix"]
