[project]
name = "kartrix"
version = "0.1.0"
description = "Kartrix — an autonomous, security-first AI coding agent with RAG-powered codebase understanding, planning and verified task execution."
readme = "README.md"
authors = [
    {name = "Roshan Karthik", email = "roshankarrthik@gmail.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.2.2,<2.0.0",
    "openai>=2.43.0,<3.0.0",
    "rich>=15.0.0,<16.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "langchain>=1.3.11,<2.0.0",
    "langchain-openai>=1.3.3,<2.0.0",
    "langchain-anthropic>=1.4.7,<2.0.0",
    "langchain-huggingface>=1.2.2,<2.0.0",
    "tree-sitter==0.21.3",
    "tree-sitter-languages==1.10.2",
    "langchain-mcp-adapters>=0.3.0,<0.4.0",
    "watchdog>=6.0.0,<7.0.0",
    "redis>=7.4.1,<8.0.0",
    "redisvl>=0.23.0,<0.24.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "langchain-nvidia-ai-endpoints>=1.0,<2.0",
    "pathspec>=0.12,<1.0",
    "pgvector>=0.4,<1.0",
]

[project.scripts]
kartrix = "kartrix.main:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kartrix"]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.13",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".uv-cache", ".uv-python", ".kartrix"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, async pitfalls, bandit (security), ruff-specific
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = [
    "E501",    # line length is the formatter's job
    "RUF001",  # ambiguous unicode in strings: the UI deliberately uses →, —, emoji
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # asserts and fake secrets are fine in tests
"migrations/**" = ["E", "W", "I", "UP"] # generated by Alembic

[tool.ruff.lint.isort]
known-first-party = ["kartrix"]
