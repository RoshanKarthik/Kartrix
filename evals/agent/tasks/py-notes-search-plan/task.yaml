id: py-notes-search-plan
app: py-notes-cli
stack: python
category: feature
mode: plan
budget: {max_tool_calls: 200, max_seconds: 1800}
timeout: 2100
task: >-
  Add a "search" command to the notes CLI: "notes search <text>" lists the notes whose text contains
  <text>, ignoring case, in the same format as "notes list". When nothing matches it prints
  "no notes found" to standard output and exits with code 1. Add tests for it and update the README.
check:
  - name: tests
    run: ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests"]
expect:
  tools: [read_file, edit_file]
notes: Plan mode — the plan is approved as proposed; its quality is judged with --judge.
