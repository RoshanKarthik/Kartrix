id: py-todo-blank-title
app: py-todo-api
stack: python
category: bugfix
task: >-
  Creating a todo whose title is only whitespace (for example "   ") succeeds and stores an empty title.
  It should be rejected with status 400, like a missing title. Fix it.
check:
  - name: tests
    run: ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests"]
expect:
  tools: [read_file, edit_file]
notes: validate_new_todo checks `not title` instead of `not title.strip()`; planted by setup/.
