    note: duration changed, refresh endpoint invented

  - id: c03
    question: How are passwords hashed?
    context:
      - "backend/app/core/security.py: password_hash = PasswordHash((Argon2Hasher(), BcryptHasher(),))"
      - "def get_password_hash(password: str) -> str:\n    return password_hash.hash(password)"
    answer: Passwords are hashed with pwdlib's PasswordHash using Argon2, with bcrypt also supported.
    faithful: true
    relevant: true

  - id: c04
    question: How are passwords hashed?
    context:
      - "backend/app/core/security.py: password_hash = PasswordHash((Argon2Hasher(), BcryptHasher(),))"
      - "def get_password_hash(password: str) -> str:\n    return password_hash.hash(password)"
    answer: Passwords are hashed with SHA-256 and a per-user salt stored in a separate salts table.
    faithful: false
    relevant: true

  - id: c05
    question: How are passwords hashed?
    context:
      - "backend/app/core/security.py: ALGORITHM = \"HS256\""
      - "def create_access_token(subject, expires_delta):\n    expire = datetime.now(UTC) + expires_delta\n    to_encode = {\"exp\": expire, \"sub\": str(subject)}\n    return jwt.encode(to_encode, settings.SECRET_KEY, algorithm=ALGORITHM)"
    answer: Access tokens are JWTs with an exp and sub claim, signed with the SECRET_KEY using HS256.
    faithful: true
    relevant: false
    note: true to the context, but about tokens, not passwords

  - id: c06
    question: What happens when the user asks `kartrix stop`?
    context:
      - "kartrix/security/kill_switch.py: def request_stop() -> float:\n    \"\"\"Ask every Kartrix run in progress on this machine (for this user) to stop. Returns the time.\"\"\"\n    now = time.time()\n    path = stop_file()\n    ... tmp.write_text(repr(now)); tmp.replace(path)"
      - "Every run that started before that moment stops (checked before each model/tool call and every half second while a command runs); runs started later are unaffected, so the file never needs clearing."
    answer: kartrix stop writes the current time into a stop file; runs that started before it stop at their next check (before each model or tool call, or within half a second while a command runs), and later runs are unaffected.
    faithful: true
    relevant: true

  - id: c07
    question: What happens when the user asks `kartrix stop`?
    context:
      - "kartrix/security/kill_switch.py: def request_stop() -> float:\n    \"\"\"Ask every Kartrix run in progress on this machine (for this user) to stop. Returns the time.\"\"\"\n    now = time.time()\n    path = stop_file()\n    ... tmp.write_text(repr(now)); tmp.replace(path)"
      - "Every run that started before that moment stops (checked before each model/tool call and every half second while a command runs); runs started later are unaffected, so the file never needs clearing."
    answer: kartrix stop sends SIGKILL to every Kartrix process on the machine, and the stop file must be deleted manually before Kartrix can run again.
    faithful: false
    relevant: true

  - id: c08
    question: Which tools does a test task agent get?
    context:
      - "kartrix/tasks/executor.py: _TOOLS_BY_TYPE = {\"design\": [*READ_TOOLS, write_file, edit_file], \"implement\": [*READ_TOOLS, *WRITE_TOOLS], \"test\": [*READ_TOOLS, *WRITE_TOOLS, run_command], \"review\": [*READ_TOOLS, write_file, edit_file], \"integrate\": [*READ_TOOLS, *WRITE_TOOLS, run_command], \"configure\": [*READ_TOOLS, *WRITE_TOOLS]}"
    answer: A test task gets the read tools, all write tools and run_command.
    faithful: true
    relevant: true

  - id: c09
    question: Which tools does a test task agent get?
    context:
      - "kartrix/tasks/executor.py: _TOOLS_BY_TYPE = {\"design\": [*READ_TOOLS, write_file, edit_file], \"implement\": [*READ_TOOLS, *WRITE_TOOLS], \"test\": [*READ_TOOLS, *WRITE_TOOLS, run_command], \"review\": [*READ_TOOLS, write_file, edit_file], \"integrate\": [*READ_TOOLS, *WRITE_TOOLS, run_command], \"configure\": [*READ_TOOLS, *WRITE_TOOLS]}"
    answer: A test task gets only the read tools, so it cannot run commands; only integrate tasks may use run_command.
    faithful: false
    relevant: true

