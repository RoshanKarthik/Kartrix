# Hand-labelled items to calibrate the LLM judge (kartrix eval calibrate).
# faithful: every claim in the answer is supported by the context.  relevant: the answer addresses the question.
# Unfaithful answers change one or two facts of a correct one (the hard case for a judge); irrelevant answers
# are true to the context but answer a different question. Labels by the Kartrix maintainers — add your own.
items:
  - id: c01
    question: How long is the access token valid?
    context:
      - "backend/app/core/config.py: ACCESS_TOKEN_EXPIRE_MINUTES: int = 60 * 24 * 8  # 60 minutes * 24 hours * 8 days = 8 days"
      - "backend/app/api/routes/login.py: access_token_expires = timedelta(minutes=settings.ACCESS_TOKEN_EXPIRE_MINUTES)"
    answer: The access token is valid for 8 days by default (ACCESS_TOKEN_EXPIRE_MINUTES = 60 * 24 * 8 in config.py), used by the login route.
    faithful: true
    relevant: true

  - id: c02
    question: How long is the access token valid?
    context:
      - "backend/app/core/config.py: ACCESS_TOKEN_EXPIRE_MINUTES: int = 60 * 24 * 8  # 60 minutes * 24 hours * 8 days = 8 days"
      - "backend/app/api/routes/login.py: access_token_expires = timedelta(minutes=settings.ACCESS_TOKEN_EXPIRE_MINUTES)"
    answer: The access token is valid for 30 minutes by default and is refreshed automatically by a refresh-token endpoint.
