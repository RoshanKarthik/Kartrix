  - id: c11
    question: Who can delete a comment?
    context:
      - "src/app/routes/article/article.service.ts: export const deleteComment = async (id: number, userId: number) => { const comment = await prisma.comment.findFirst({ where: { id, author: { id: userId } } ... }); if (!comment) { throw new HttpException(404, {}); } if (comment.author.id !== userId) { throw new HttpException(403, { message: 'You are not authorized to delete this comment' }); } await prisma.comment.delete({ where: { id } }); };"
    answer: Only the comment's author; otherwise the API answers 404 when the comment isn't found for that author, or 403 with "You are not authorized to delete this comment".
    faithful: true
    relevant: true

  - id: c12
    question: Who can delete a comment?
    context:
      - "src/app/routes/article/article.service.ts: export const deleteComment = async (id: number, userId: number) => { const comment = await prisma.comment.findFirst({ where: { id, author: { id: userId } } ... }); if (!comment) { throw new HttpException(404, {}); } if (comment.author.id !== userId) { throw new HttpException(403, { message: 'You are not authorized to delete this comment' }); } await prisma.comment.delete({ where: { id } }); };"
    answer: The comment's author or the author of the article it belongs to; admins can delete any comment.
    faithful: false
    relevant: true

  - id: c13
    question: What exit code does `kartrix run` return when the budget stops the run?
    context:
      - "kartrix/headless/runner.py: EXIT_CODES = {\"completed\": 0, \"failed\": 1, \"error\": 1, \"stopped\": 2, \"not_started\": 3}"
      - "Exit codes: 0 completed · 1 failed (a task failed, or the agent raised) · 2 stopped (budget limit or kill switch) · 3 could not start (invalid spec, configuration, services)."
    answer: It exits with code 2 (stopped), the same as for the kill switch.
    faithful: true
    relevant: true

  - id: c14
    question: What exit code does `kartrix run` return when the budget stops the run?
    context:
