name: Evals

# The agent and RAG eval suite (roadmap 2.3) against the committed baseline. Real model calls, so it
# runs nightly on the quick subset and on demand — never on every push. Needs the repository secrets
# NVIDIA_API_KEY (models + embeddings) and HF_TOKEN (the fallback provider is checked at startup).

on:
  schedule:
    - cron: "17 3 * * *"   # nightly, quick subset
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite
        type: choice
        options: [all, rag, agent, calibrate]
        default: all
      subset:
        description: quick (everyday) or full (baseline-sized)
        type: choice
        options: [quick, full]
        default: quick
      repeat:
        description: Runs per agent task (pass^k needs 2+)
        default: "1"

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

env:
  UV_FROZEN: "1"
  UV_PYTHON_INSTALL_DIR: .uv-python
  POSTGRES_USER: kartrix
  POSTGRES_PASSWORD: ci-postgres-password
  POSTGRES_DB: kartrix
  REDIS_PASSWORD: ci-redis-password
  DATABASE_URL: postgresql+asyncpg://kartrix:ci-postgres-password@127.0.0.1:5432/kartrix
  REDIS_URL: redis://:ci-redis-password@127.0.0.1:6379/0
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the kartrix fixture is this repository at a pinned commit
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # the TypeScript task apps run with Node's type stripping
      - name: Sandbox (bubblewrap)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Start Postgres (pgvector) + Redis
        run: docker compose up -d --wait
      - name: Install
        run: uv sync
      - name: Migrations
        run: uv run alembic upgrade head
      - name: Run the evals
        run: |
          suite="${{ inputs.suite || 'all' }}"
          subset="${{ inputs.subset || 'quick' }}"
          args=(--compare --fail-on-regression --out eval-results --repeat "${{ inputs.repeat || '1' }}")
          if [ "$subset" = "quick" ]; then args+=(--quick); fi
          uv run kartrix eval "$suite" "${args[@]}"
      - name: Upload results and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: |
            eval-results/
            .kartrix/evals/agent-runs/*/runs/
          if-no-files-found: warn
