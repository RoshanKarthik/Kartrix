# Kartrix settings — validated by kartrix/config.py (unknown or duplicate keys are errors).
# Any value can be overridden with an env var: KARTRIX_<SECTION>__<KEY>, e.g. KARTRIX_LLM__MODEL.
# Secrets (API keys, passwords) never go here — put them in .env.

embeddings:
  provider: nvidia              # nvidia | openai | huggingface (no fallback: vectors must stay comparable)
  model: nvidia/nemotron-3-embed-1b
  dims: 2048                    # must match the model's output size
  timeout: 60
  retry:
    max_retries: 3

semantic_cache:
  enabled: true
  redis_url: redis://localhost:6379
  threshold: 0.85
  ttl: 86400

tasks:
  db_path: .kartrix/tasks.db

llm:
  provider: nvidia              # nvidia | huggingface | openai | anthropic
  model: nvidia/nemotron-3-super-120b-a12b
  judge_model: openai/gpt-oss-20b   # cheaper model used only for LLM-as-judge
  timeout: 90                   # seconds per request
  retry:                        # transient errors only (timeouts, 429, 5xx)
    max_retries: 2
    initial_delay: 1.0
    backoff_factor: 2.0
    max_delay: 30
  fallbacks:                    # tried in order when the primary still fails after retries; [] = none
    - provider: nvidia          # different NIM model: free, separate capacity
      model: google/gemma-4-31b-it
    - provider: huggingface     # via the OpenAI-compatible HF router (monthly free credits)
      model: Qwen/Qwen3-Coder-30B-A3B-Instruct

skills:
  skills_dir: .kartrix/skills

memory:
  db_path: .kartrix/memory/memory.db
  summarize_at_tokens: 4000
  keep_last_messages: 20

chromadb:
  persist_dir: .kartrix/chromadb/
  collection_name: codebase

rag:
  mode: semantic                # semantic | hybrid

vector_store:
  provider: chroma              # chroma | qdrant
  retrieval_mode: dense         # dense | sparse | hybrid (qdrant only)

qdrant:
  collection_name: kartrix

database:                       # URL comes from DATABASE_URL in .env
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
  echo: false

logging:
  level: INFO                   # level for kartrix.* loggers
  format: json                  # json | text
  console_level: WARNING        # what reaches stderr (keeps the REPL clean)
  file: .kartrix/logs/kartrix.jsonl   # null to disable file logging
