# Kartrix settings — validated by kartrix/config.py (unknown or duplicate keys are errors).
# Any value can be overridden with an env var: KARTRIX_<SECTION>__<KEY>, e.g. KARTRIX_LLM__MODEL.
# Secrets (API keys, passwords) never go here — put them in .env.

embeddings:
  provider: nvidia              # nvidia | openai | huggingface (no fallback: vectors must stay comparable)
  model: nvidia/nemotron-3-embed-1b
  dims: 2048                    # must match the model's output size
  timeout: 60
  retry:
    max_retries: 3

semantic_cache:                 # URL (with password) comes from REDIS_URL in .env
  enabled: true
  namespace: kartrix            # keys: <namespace>:cache:<repo>:<hash>
  threshold: 0.85
  ttl: 86400

llm:
  provider: nvidia              # nvidia | huggingface | openai | anthropic
  model: nvidia/nemotron-3-super-120b-a12b
  judge_model: openai/gpt-oss-20b   # cheaper model used only for LLM-as-judge
  router_model: openai/gpt-oss-20b  # cheap model that routes each request (chat / question / change)
  timeout: 90                   # seconds per request
  retry:                        # transient errors only (timeouts, 429, 5xx)
    max_retries: 2
    initial_delay: 1.0
    backoff_factor: 2.0
    max_delay: 30
  fallbacks:                    # tried in order when the primary still fails after retries; [] = none
    - provider: nvidia          # different NIM model: free, separate capacity
      model: google/gemma-4-31b-it
    - provider: huggingface     # via the OpenAI-compatible HF router (monthly free credits)
      model: Qwen/Qwen3-Coder-30B-A3B-Instruct

skills:
  skills_dir: .kartrix/skills

memory:                         # conversation checkpoints live in Postgres
  session_file: .kartrix/current_session
  summarize_at_tokens: 4000
  keep_last_messages: 20
  recall_k: 5                   # long-term memories recalled per turn
  min_similarity: 0.3
  dedupe_similarity: 0.92       # a new memory this close replaces the old one (newer wins)

index:                          # what gets indexed (on top of every .gitignore in the repo)
  max_file_kb: 512              # larger files are skipped
  embed_batch_size: 32
  exclude:                      # gitignore syntax; always skipped, even outside git repos
    - .git/
    - .kartrix/
    - .venv/
    - venv/
    - node_modules/
    - __pycache__/
    - .env
    - .env.*
    - "*.pem"
    - "*.key"
    - "*.p12"
    - "*.pfx"
    - id_rsa*
    - id_ed25519*

workspace:                      # file tools are jailed to the repo Kartrix runs in (gitignore syntax below)
  deny_read:                    # never read (or sent to the LLM)
    - .git/
    - .kartrix/*
    - "!.kartrix/skills/"
    - .env
    - .env.*
    - "!.env.example"
    - "!.env.sample"
    - "!.env.template"
    - "*.pem"
    - "*.key"
    - "*.p12"
    - "*.pfx"
    - id_rsa*
    - id_ed25519*
    - "!*.pub"
  deny_write:                   # never created, changed or overwritten
    - .git/
    - .kartrix/
    - .env
    - .env.*
    - "!.env.example"
    - "!.env.sample"
    - "!.env.template"
    - "*.pem"
    - "*.key"
    - "*.p12"
    - "*.pfx"
    - id_rsa*
    - id_ed25519*
  max_file_kb: 2048             # largest file the tools will load or write

permissions:                    # what the agent's commands may do (kartrix/security/permissions.py)
  mode: default                 # read_only | default | auto  (switch at runtime with /mode)
  allow: []                     # extra rules, e.g. "make test", "npm run *" (trailing * = any arguments)
  ask: []
  deny: []                      # deny > ask > allow; the built-in hard deny list always wins
  registries:                   # package installs may only use these indexes / registries
    - pypi.org
    - files.pythonhosted.org
    - registry.npmjs.org
    - registry.yarnpkg.com
  command_timeout: 300          # seconds; the whole process tree is killed after this
  env_passthrough: []           # env vars passed to commands even though their name looks secret

budgets:                        # a run stops at the next model/tool call once a limit is reached (null = no limit)
  turn:                         # one chat request
    max_tokens: 1500000         # input + output tokens of all model calls
    max_cost_usd: 2.0           # only for models with a price below
    max_tool_calls: 80
    max_seconds: 1200           # time waiting for your approval doesn't count
  plan:                         # one /plan run: planning, every task and the judge
    max_tokens: 10000000
    max_cost_usd: 10.0
    max_tool_calls: 600
    max_seconds: 7200
  prices:                       # USD per million tokens; models not listed count tokens but no cost
    nvidia/nemotron-3-super-120b-a12b: {input: 0, output: 0}   # NVIDIA free tier
    openai/gpt-oss-20b: {input: 0, output: 0}
    google/gemma-4-31b-it: {input: 0, output: 0}
    Qwen/Qwen3-Coder-30B-A3B-Instruct: {input: 0, output: 0}   # Hugging Face monthly free credits

checkpoints:                    # snapshot before every turn and /plan task, for /undo (needs git on PATH)
  enabled: true
  keep: 50                      # undo entries kept per workspace
  exclude:                      # never snapshotted or touched by /undo (plus .gitignore and the secret patterns)
    - node_modules/
    - .venv/
    - venv/
    - __pycache__/
    - .mypy_cache/
    - .pytest_cache/
    - .ruff_cache/
    - .next/
    - .turbo/

sandbox:                        # where commands that run code execute (kartrix/sandbox/; `kartrix sandbox` shows it)
  backend: auto                 # auto | native | docker | none — none: every command that runs code needs approval
  limits:
    memory_mb: 4096             # whole command tree on Windows/Docker, per process on Linux (macOS: not enforced)
    max_processes: 512          # not enforced on macOS
    max_file_mb: 2048           # largest file a command may write (macOS / Linux)
  deny_read_home:               # never readable by sandboxed commands (relative to your home folder)
    - .ssh
    - .gnupg
    - .aws
    - .azure
    - .kube
    - .docker
    - .config/gcloud
    - .config/gh
    - .config/git
    - .git-credentials
    - .netrc
    - .npmrc
    - .yarnrc
    - .yarnrc.yml
    - .pypirc
    - .password-store
    - .local/share/keyrings
    - Library/Keychains
    - .config/kartrix
    - .local/share/kartrix
    - Library/Application Support/kartrix
    - AppData/Local/kartrix
  extra_read: []                # folders sandboxed commands may also read (Windows: e.g. a toolchain in your profile)
  extra_write: []               # folders outside the workspace they may also write
  docker:
    image: null                 # backend: docker only — an image with your project's toolchain
    cpus: null

retrieval:
  mode: hybrid                  # hybrid (pgvector + Postgres full-text, RRF) | dense | sparse
  top_k: 5
  candidates: 40                # per-retriever results before fusion
  rrf_k: 60

database:                       # URL comes from DATABASE_URL in .env
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
  echo: false

logging:
  level: INFO                   # level for kartrix.* loggers
  format: json                  # json | text
  console_level: WARNING        # what reaches stderr (keeps the REPL clean)
  file: .kartrix/logs/kartrix.jsonl   # null to disable file logging
